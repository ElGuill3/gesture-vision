[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-vision"
version = "0.1.0"
description = "Local gesture-recognition workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
gamepad = ["vgamepad>=0.1.0"]

[project.scripts]
gesture-vision = "gesture_vision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gesture_vision = ["defaults.yaml"]
