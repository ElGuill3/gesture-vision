PATHS:
  root: .
  sessions: data/sessions
  bundles: data/models/bundles
CAMERA:
  camera_index: 0
MEDIAPIPE:
  max_num_hands: 2
  min_detection_confidence: 0.8
  min_tracking_confidence: 0.8
INFERENCE:
  prediction_threshold: 0.7
  smoothing_window: 5
FEATURES:
  schema: mediapipe-xyz-wrist-v1
  dimension: 63
TRAINING:
  split_seed: 42
  hidden_units: 128
  epochs: 100
  batch_size: 32
  learning_rate: 0.003
GAMEPAD:
  trigger_value: 255
  hand_mapping:
    left_hand: {controls: [dpad, LB, LT]}
    right_hand: {controls: [A, B, X, Y, RB, RT]}
  gesture_to_dpad:
    up: XUSB_GAMEPAD_DPAD_UP
    down: XUSB_GAMEPAD_DPAD_DOWN
    left: XUSB_GAMEPAD_DPAD_LEFT
    right: XUSB_GAMEPAD_DPAD_RIGHT
    upleft: XUSB_GAMEPAD_DPAD_UP,XUSB_GAMEPAD_DPAD_LEFT
    upright: XUSB_GAMEPAD_DPAD_UP,XUSB_GAMEPAD_DPAD_RIGHT
    downleft: XUSB_GAMEPAD_DPAD_DOWN,XUSB_GAMEPAD_DPAD_LEFT
    downright: XUSB_GAMEPAD_DPAD_DOWN,XUSB_GAMEPAD_DPAD_RIGHT
  gesture_to_action_buttons: {A: XUSB_GAMEPAD_A, B: XUSB_GAMEPAD_B, X: XUSB_GAMEPAD_X, Y: XUSB_GAMEPAD_Y}
  gesture_to_shoulder_buttons: {LB: XUSB_GAMEPAD_LEFT_SHOULDER, RB: XUSB_GAMEPAD_RIGHT_SHOULDER}
  gesture_to_triggers: {LT: left_trigger, RT: right_trigger}
